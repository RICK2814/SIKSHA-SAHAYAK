{% extends 'base.html' %}
{% block title %}Classes - Siksha Sahayak{% endblock %}
{% block content %}
<div class="container py-5">
    <h3 class="fw-bold mb-4"><i class="bi bi-grid-3x3-gap me-2 text-primary"></i>Select Your Class</h3>
    <div class="row g-4">
        {% for class in classes %}
        <div class="col-md-4 col-lg-3">
            <a href="{% url 'subject_list' class.id %}" class="text-decoration-none">
                <div class="card border-0 shadow-sm h-100 class-card">
                    <div class="card-body text-center p-4">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                            <i class="bi bi-mortarboard" style="font-size: 2rem;"></i>
                        </div>
                        <h5 class="fw-bold text-dark">{{ class.name }}</h5>
                        <p class="text-muted small mb-0">{{ class.subjects.count }} Subjects</p>
                    </div>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="col-12 text-center text-muted py-5">
            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
            <p class="mt-2">No classes available yet.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
